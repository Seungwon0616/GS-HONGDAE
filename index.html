<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ABC마트 GS 홍대점 계좌이체 내역</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#14181f;--sub:#5d6675;--brand:#0b5fff;--brand-fg:#fff;--ok:#0a7d3c;--err:#c62828;--line:#dfe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--fg:#f1f3f7;--sub:#9aa3b2;--brand:#4d8dff;--brand-fg:#06101f;--ok:#4cc38a;--err:#ff7b72;--line:#262c38}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:max(env(safe-area-inset-top),28px) 20px max(env(safe-area-inset-bottom),28px)}
h1{font-size:clamp(28px,8vw,44px);line-height:1.25;text-align:center;margin:8px 0 0;font-weight:800;letter-spacing:-.02em;word-break:keep-all}
main{flex:1;width:100%;max-width:420px;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-bottom:12vh}
#pick{width:100%;min-height:84px;border:0;border-radius:20px;background:var(--brand);color:var(--brand-fg);font:inherit;font-size:24px;font-weight:700;cursor:pointer}
#pick:disabled{opacity:.55;cursor:default}
#pick:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
#msg{min-height:28px;text-align:center;font-size:18px;color:var(--sub);word-break:keep-all}
#msg.ok{color:var(--ok);font-weight:700}#msg.err{color:var(--err)}
</style>
</head>
<body>
<h1>ABC마트 GS 홍대점<br>계좌이체 내역</h1>
<main>
  <input id="file" type="file" accept="image/*" hidden>
  <button id="pick" type="button">사진 업로드</button>
  <div id="bar"><i></i></div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
// ▼ Supabase 대시보드 > Project Settings > API 에서 복사 (anon public 키는 공개돼도 안전한 키입니다)
const SUPABASE_URL = "https://rzctfllcogksodqvyfvo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_z34EmNDU8uE7ZHziHw5RgQ_JjB1FW1E";
const BUCKET = "transfers";
const MAX_SIDE = 2560;   // 긴 변 최대 픽셀 (글씨 선명도 유지)
const QUALITY = 0.9;     // 화질 (0~1)

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:false,autoRefreshToken:false}});
const $ = id => document.getElementById(id);
const pick = $("pick"), file = $("file"), msg = $("msg"), bar = $("bar"), fill = bar.firstElementChild;

function say(t, cls){ msg.textContent = t; msg.className = cls || ""; }
function progress(p){ bar.style.display = p == null ? "none" : "block"; fill.style.width = (p||0) + "%"; }

function loadImage(f){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
function toBlob(canvas, type, q){ return new Promise(r => canvas.toBlob(r, type, q)); }

// 사진을 선명도는 유지하면서 용량만 크게 줄입니다 (WebP 우선, 미지원 시 JPEG)
async function compress(f){
  const img = await loadImage(f);
  const w0 = img.naturalWidth, h0 = img.naturalHeight, s = Math.min(1, MAX_SIDE / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  let blob = await toBlob(c, "image/webp", QUALITY), ext = "webp";
  if(!blob || blob.type !== "image/webp"){ blob = await toBlob(c, "image/jpeg", QUALITY); ext = "jpg"; }
  const okType = ["image/jpeg","image/png","image/webp"].includes(f.type);
  if(okType && f.size <= blob.size){ blob = f; ext = f.type === "image/png" ? "png" : f.type === "image/webp" ? "webp" : "jpg"; }
  return {blob, ext};
}

function kstStamp(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const h = p.hour === "24" ? "00" : p.hour;
  return {date:`${p.year}-${p.month}-${p.day}`, time:`${h}${p.minute}${p.second}`};
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/-/g,"").slice(0,12); }

pick.addEventListener("click", () => file.click());
file.addEventListener("change", async () => {
  const f = file.files[0]; file.value = "";
  if(!f) return;
  if(!f.type.startsWith("image/")){ say("이미지 파일만 올릴 수 있어요.", "err"); return; }
  pick.disabled = true; say("사진을 준비하고 있어요…"); progress(15);
  try{
    const {blob, ext} = await compress(f);
    progress(45); say("업로드 중이에요…");
    const {date, time} = kstStamp();
    const path = `${date}/${time}-${uid()}.${ext}`;
    const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType: blob.type || "image/jpeg", upsert:false, cacheControl:"3600"});
    if(error) throw error;
    progress(100); setTimeout(() => progress(null), 600);
    say("업로드가 완료되었습니다. 감사합니다!", "ok");
    pick.textContent = "사진 한 장 더 올리기";
  }catch(e){
    console.error(e); progress(null);
    say("업로드에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.", "err");
  }finally{ pick.disabled = false; }
});
</script>
</body>
</html>
